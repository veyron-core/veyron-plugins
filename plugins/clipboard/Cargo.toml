[package]
name = "clipboard-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "clipboard_plugin"
path = "src/lib.rs"

[[bin]]
name = "clipboard"
path = "src/main.rs"

[dependencies]
veyron-sdk = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
serde_json = "1"
async-trait = "0.1"
