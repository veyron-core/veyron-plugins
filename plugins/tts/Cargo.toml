[package]
name = "tts-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "tts_plugin"
path = "src/lib.rs"

[[bin]]
name = "tts"
path = "src/main.rs"

[dependencies]
veyron-sdk = "0.1"
veyron-wire = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sherpa-onnx = "1.13"
